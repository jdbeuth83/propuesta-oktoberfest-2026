<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap');
:root{--gold:#E9A72C;--cream:#EEE7D6}

html,body{background:transparent}
.hero{width:1500px;min-height:1500px;display:flex;flex-direction:column;align-items:center;

.rule{width:200px;height:5px;background:var(--gold);border-radius:3px;margin:30px 0 0}
.when{font-weight:700;font-size:84px;letter-spacing:.05em;text-transform:uppercase;color:var(--cream);
  margin-top:18px;text-shadow:0 5px 30px rgba(0,0,0,.9)}
.place{font-weight:600;font-size:46px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
  margin-top:8px;text-shadow:0 3px 18px rgba(0,0,0,.9)}
.feats{font-weight:600;font-size:34px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream);
  margin-top:26px;text-shadow:0 3px 16px rgba(0,0,0,.9)}
.feats i{color:var(--gold);font-style:normal;margin:0 12px;opacity:.85}
